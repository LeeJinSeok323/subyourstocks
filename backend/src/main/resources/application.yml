spring:
  datasource:
    mysql:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/stocker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      username: ${MYSQL_USER:jinseoki}
      password: ${MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    clickhouse:
      url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/stocker
      username: ${CLICKHOUSE_USER:jinseoki}
      password: ${CLICKHOUSE_PASSWORD:}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 60000

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.stocker: DEBUG
    org.springframework.jdbc: WARN
