spring:
  datasource:
    mysql:
      url: jdbc:mysql://localhost:3306/stocker?useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USER:jinseoki}
      password: ${MYSQL_PASSWORD:}
