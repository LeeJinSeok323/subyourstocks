spring:
  datasource:
    mysql:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/stocker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    clickhouse:
      jdbc-url: jdbc:ch:http://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/stocker?compress=0
      username: ${CLICKHOUSE_USER}
      password: ${CLICKHOUSE_PASSWORD}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 60000

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000   # 24시간 (ms)

telegram:
  bot-token:     ${TELEGRAM_BOT_TOKEN}
  bot-username:  ${TELEGRAM_BOT_USERNAME}
  server-url:    ${SERVER_DOMAIN:}

logging:
  level:
    com.stocker: DEBUG
    org.springframework.jdbc: WARN
